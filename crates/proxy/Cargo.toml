[package]
name = "proxenos"
description = "Run Claude Code against models served over a ChatGPT subscription"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "proxenos"
path = "src/lib.rs"

[[bin]]
name = "proxenos"
path = "src/main.rs"

[features]
default = []
# The tokenizer-backed estimator. Off by default — see docs/proxy-behavior.md
# §6.3 for why, and for the measurement that settled it.
tokenizer = ["dep:tiktoken-rs"]

[lints]
workspace = true

[dependencies]
proxenos-core.workspace = true

anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tiktoken-rs = { workspace = true, optional = true }
tokio.workspace = true
yawc.workspace = true
toml.workspace = true
zstd.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
proxenos-core.workspace = true
hyper.workspace = true
hyper-util.workspace = true
insta.workspace = true
pretty_assertions.workspace = true
reqwest.workspace = true
rstest.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
yawc.workspace = true
toml.workspace = true
zstd.workspace = true
