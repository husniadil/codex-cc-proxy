[workspace]
members = ["crates/core", "crates/proxy"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/husniadil/proxenos"
authors = ["proxenos contributors"]

[workspace.dependencies]
proxenos-core = { path = "crates/core" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
futures = "0.3"
notify = "8"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
    "fs",
    "io-util",
] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
# The WebSocket client. Chosen over tokio-tungstenite for one reason:
# `permessage-deflate`, which the backend negotiates and which takes roughly two
# thirds off every frame in both directions. tungstenite has no deflate at any
# published version, and its public API is message-level — the RSV1 bit a
# compressed frame is marked with is not reachable from outside the crate.
yawc = { version = "0.3", default-features = false, features = ["rustls-ring", "zlib"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# Test-only: yawc's server side upgrades a hyper request, and a deflate-speaking
# server is the only way to prove the client negotiates deflate offline.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

# Optional token-counting backend, selected by feature flag. See
# docs/proxy-behavior.md §6.3.
tiktoken-rs = "0.7"

# Development
insta = { version = "1", features = ["json", "redactions"] }
pretty_assertions = "1"
rstest = "0.26"
tempfile = "3"
wiremock = "0.6"

[workspace.lints.clippy]
# Panicking paths are unacceptable in a long-running proxy: a panic mid-stream
# drops a live conversation. Fallible operations must be handled explicitly.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Correctness hazards specific to async request handling.
await_holding_lock = "deny"
await_holding_invalid_type = "deny"

# Readability rules kept mechanical so review attention goes to behaviour.
needless_borrow = "deny"
needless_collect = "deny"
redundant_clone = "deny"
redundant_closure_for_method_calls = "deny"
uninlined_format_args = "deny"
unnecessary_to_owned = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
