name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The gate runs again on the tag. A release built from a commit that never
  # passed it is a release nobody checked.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: just check

  binaries:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="codex-cc-proxy-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ -f "target/${{ matrix.target }}/release/codex-cc-proxy.exe" ]; then
            cp "target/${{ matrix.target }}/release/codex-cc-proxy.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/codex-cc-proxy" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cd dist && tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-cc-proxy-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Checksums are generated here rather than per-platform, so one file
      # covers every artifact and is signed by the same run that built them.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Nothing in this release has been confirmed against a live backend.
            Every capability claim is derived from the upstream protocol
            definitions and verified against replayed fixtures — see
            `docs/roadmap.md` §L for what only a subscription can settle, and
            run `codex-cc-proxy doctor` to see the same distinction in its own
            output.
