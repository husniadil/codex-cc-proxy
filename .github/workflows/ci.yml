name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # One job running exactly what `just check` runs locally. A gate that differs
  # between CI and the developer's machine is a gate that gets argued with.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
      # `.tool-versions` pins the toolchain version but cannot express
      # components, so a freshly installed toolchain has neither rustfmt nor
      # clippy — and `just check` is two thirds those. `just setup` adds the
      # same two locally, so the gate stays identical on both sides.
      - run: rustup component add rustfmt clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: just check

  # The suite never touches the network, so the build is the only
  # platform-dependent part worth proving on every platform.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
